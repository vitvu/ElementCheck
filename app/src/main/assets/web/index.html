<head>

<main>
  <section class="panel" id="screenPanel">
    <div class="bar">
      <div class="seg">
        <button id="modeInspect" class="active" title="Inspect"><svg><use href="#i-inspect"/></svg></button>
        <button id="modeControl" title="Control device"><svg><use href="#i-touch"/></svg></button>
      </div>
      <button id="btnRefresh" class="icon" title="Refresh (R)"><svg><use href="#i-refresh"/></svg></button>
      <button id="btnCapture" class="icon" title="Capture and save"><svg><use href="#i-camera"/></svg></button>
      <button id="btnCaptures" class="icon" title="Saved captures"><svg><use href="#i-folder"/></svg></button>
      <span class="grow"></span>
      <label class="switch" title="Show all bounds"><input type="checkbox" id="optGrid"><span></span>Grid</label>
    </div>
    <div id="sourceBar" class="hidden">
      <svg><use href="#i-folder"/></svg><span id="sourceName"></span>
      <button id="btnLive" title="Back to device"><svg><use href="#i-phone"/></svg>Device</button>
    </div>
    <div id="screenBox">
      <div id="screenWrap">
        <canvas id="imgCanvas"></canvas>
        <canvas id="boxCanvas"></canvas>
      </div>
    </div>
    <div id="controlBar" class="hidden">
      <input id="typeText" placeholder="Type into focused field" autocomplete="off">
      <button id="btnSend" class="icon" title="Set text"><svg><use href="#i-send"/></svg></button>
      <button id="btnEnter" class="icon" title="Enter"><svg><use href="#i-enter"/></svg></button>
    </div>
    <div class="nav">
      <button data-global="notifications" title="Notifications"><svg><use href="#i-notif"/></svg></button>
      <button data-global="recents" title="Recents"><svg><use href="#i-recents"/></svg></button>
      <button data-global="home" title="Home"><svg><use href="#i-home"/></svg></button>
      <button data-global="back" title="Back"><svg><use href="#i-back"/></svg></button>
    </div>
  </section>

  <section class="panel" id="mainPanel">
    <div class="props">
      <table>
        <thead><tr><th>Prop</th><th>Value</th></tr></thead>
        <tbody id="propBody"></tbody>
      </table>
    </div>
    <div class="treeCol">
      <div class="bar">
        <div class="search">
          <svg><use href="#i-search"/></svg>
          <input id="search" placeholder="Text, id, class or XPath" autocomplete="off">
          <span id="findCount"></span>
        </div>
        <button id="btnPrev" class="icon" title="Previous"><svg><use href="#i-up"/></svg></button>
        <button id="btnNext" class="icon" title="Next"><svg><use href="#i-down"/></svg></button>
        <button id="btnCopyXml" title="Copy XML"><svg><use href="#i-copy"/></svg>XML</button>
      </div>
      <div id="tree"><div id="treeInner"></div></div>
    </div>
  </section>
</main>

<div id="capModal" class="modal hidden">
  <div class="sheet">
    <div class="bar">
      <h3>Captures <span id="capCount" class="muted"></span></h3>
      <span class="grow"></span>
      <button id="capNew" class="primary"><svg><use href="#i-add"/></svg>New capture</button>
      <button id="capClose" class="icon" title="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div id="capGrid"></div>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
