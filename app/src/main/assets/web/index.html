<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElementCheck</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <section class="panel" id="screenPanel">
    <div class="bar">
      <div class="group">
        <button id="btnInspect" class="icon active" title="Inspect (off = tap/swipe on device)">
          <svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg>
        </button>
        <button id="btnRefresh" class="icon" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button id="btnCapture" class="icon" title="Capture and save on device">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M4 8h3l2-3h6l2 3h3v11H4z"/></svg>
        </button>
      </div>
      <select id="source" title="Source"><option value="live">Device</option></select>
      <label class="switch" title="Show all element bounds"><input type="checkbox" id="optGrid"><span></span>Grid</label>
    </div>
    <div id="screenBox">
      <div id="screenWrap">
        <canvas id="imgCanvas"></canvas>
        <canvas id="boxCanvas"></canvas>
      </div>
    </div>
    <div class="nav">
      <button data-global="recents" title="Recents"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
      <button data-global="home" title="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
      <button data-global="back" title="Back"><svg viewBox="0 0 24 24"><path d="M10 6l-6 6 6 6M4 12h16"/></svg></button>
    </div>
  </section>

  <section class="panel" id="mainPanel">
    <div class="props">
      <table>
        <thead><tr><th>Prop</th><th>Value</th></tr></thead>
        <tbody id="propBody"></tbody>
      </table>
    </div>
    <div class="treeCol">
      <div class="bar">
        <div class="search">
          <input id="search" placeholder="Find by string, tag or XPath" autocomplete="off">
          <span id="findCount"></span>
        </div>
        <button id="btnPrev" class="icon" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button id="btnNext" class="icon" title="Next"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="btnCopyXml" title="Copy XML">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>Copy XML
        </button>
      </div>
      <div id="tree"><div id="treeInner"></div></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
